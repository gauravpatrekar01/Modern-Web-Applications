<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stack Operations</title>
    <link rel="stylesheet" href="style.css">
    <script src="file.js"></script>
</head>
<body>
    <div id="container">
      <h2>Stack Operations</h2>
      <p style="margin-top: 2px;">
        Designed by
        <a href="https://github.com/gauravpatrekar01"> Gaurav Patrekar </a>
      </p>
      <input id="inputString" placeholder="Enter Your String" />

      <button id="b1" onclick="arrPush(document.getElementById('inputString').value)">Push</button>
      <button id="b2" onclick="arrPop()">Pop</button>
      <button id="b3" onclick="arrShift()">Shift</button>
      <button id="b4" onclick="arrUnshift(document.getElementById('inputString').value)">Unshift</button>

      <div id="result"></div>
    </div>
</body>
</html>
